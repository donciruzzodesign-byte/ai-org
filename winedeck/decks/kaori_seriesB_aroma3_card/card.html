<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;}
body{margin:0;background:#ffffff;font-family:"Hiragino Sans","Noto Sans CJK JP",sans-serif;}
#page{width:1080px;padding:64px;background:#F5F0E8;}
#frame{border:1.4px solid #C9A84C;padding:40px 36px;position:relative;}

.badge{width:132px;height:132px;border-radius:50%;}
.pill{margin-top:18px;padding:8px 20px;border-radius:20px;font-size:17px;font-weight:700;}
.desc{font-size:14.5px;color:#6B5848;margin-top:12px;text-align:center;line-height:1.5;}
.hr{width:100%;height:1px;background:#E3D6BD;margin:20px 0 18px 0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;width:100%;}
.item{display:flex;align-items:center;gap:8px;}
.item img{width:40px;height:40px;object-fit:contain;flex:0 0 auto;}
.item span{font-size:16px;font-weight:600;color:#2B2320;}
.footer{text-align:center;padding-top:30px;font-size:13px;letter-spacing:3px;color:#9A8B72;}
