<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;}
body{margin:0;background:#ffffff;font-family:"Hiragino Sans","Noto Sans CJK JP","Yu Gothic",sans-serif;}
#page{width:1080px;padding:56px;background:#FAF6EE;}
#frame{border:1.4px solid #C9A84C;padding:30px;position:relative;}
#frame:before{content:"";position:absolute;inset:8px;border:0.8px solid #C9A84C;opacity:.35;}
.hd{padding:4px 6px 22px 6px;}
.hd .eyebrow{font-size:20px;letter-spacing:4px;color:#6B1A2A;font-weight:600;}
.hd h1{font-family:"Hiragino Mincho ProN","Noto Serif CJK JP",serif;font-size:40px;
  margin:8px 0 6px 0;color:#2B2B2B;font-weight:700;letter-spacing:1px;}
.hd .sub{font-size:19px;color:#6B5848;letter-spacing:1px;}
.hr{height:1px;background:#C9A84C;opacity:.5;margin:18px 0 26px 0;}
.section{display:flex;align-items:stretch;margin-bottom:2px;border:1px solid #E3D6BD;}
.side{flex:0 0 46px;background:#6B1A2A;display:flex;align-items:center;justify-content:center;}
.side span{writing-mode:vertical-rl;color:#F5EFE0;
  font-size:16px;font-weight:700;letter-spacing:3px;white-space:nowrap;}
.body{flex:1;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th,td{border:1px solid #E3D6BD;padding:7px 8px;font-size:14.5px;text-align:center;
  color:#2B2B2B;line-height:1.3;word-break:keep-all;}
th{background:#F3E6C9;color:#6B1A2A;font-weight:700;font-size:14px;}
th.sub{background:#FAF3E2;color:#8A5A2A;}
td{background:#FFFFFF;}
tr.alt td{background:#FBF5E9;}
.band td{background:#6B1A2A;color:#F5EFE0;font-weight:700;letter-spacing:2px;
  font-size:14px;padding:7px;}
.band.result td{background:#F3E6C9;color:#6B1A2A;font-weight:600;font-size:14.5px;}
.footer{text-align:center;padding-top:22px;font-size:13px;letter-spacing:3px;color:#6B5848;}
</style></head>
<body><div id="page"><div id="frame">
<div class="hd"><div class="eyebrow">保存版テンプレート</div><h1>テイスティング早見表</h1>
<div class="sub">見た目・香り・飲んでみて・総合</div></div>
<div class="hr"></div>
<div class="section"><div class="side"><span>見た目</span></div><div class="body"><table><tr><th>色の濃さ</th><th>透明感</th><th>とろみ</th></tr><tr><td>うすい</td><td>にごってる</td><td>さらさら</td></tr><tr class="alt"><td>ふつう</td><td>ふつう</td><td>ふつう</td></tr><tr><td>こい</td><td>すきとおってる</td><td>とろっと</td></tr></table></div></div><div class="section"><div class="side"><span>香り</span></div><div class="body"><table><tr><th>香りの強さ</th><th>香りのタイプ</th></tr><tr><td>かすか</td><td>フルーティ</td></tr><tr class="alt"><td>ふつう</td><td>フローラル</td></tr><tr><td>強い</td><td>スパイシー</td></tr><tr class="alt"><td></td><td>樽っぽい</td></tr></table></div></div><div class="section"><div class="side"><span>飲んでみて</span></div><div class="body"><table><tr><th>甘さ</th><th>酸っぱさ</th><th>渋さ（赤のみ）</th><th>コク</th></tr><tr><td>辛口</td><td>おだやか</td><td>少ない</td><td>軽い</td></tr><tr class="alt"><td>ふつう</td><td>ふつう</td><td>ふつう</td><td>ふつう</td></tr><tr><td>甘口</td><td>強い</td><td>強い</td><td>重い</td></tr></table></div></div><div class="section"><div class="side"><span>総合</span></div><div class="body"><table><tr><th>余韻</th><th>ひとこと評価</th></tr><tr><td>短い</td><td>ふつう</td></tr><tr class="alt"><td>ふつう</td><td>おいしい</td></tr><tr><td>長い</td><td>感動</td></tr></table><table><tr class="band"><td>保存して記録しよう</td></tr></table><table><tr class="band result"><td>また飲みたい</td><td>人にすすめたい</td><td>保存版にする</td></tr></table></div></div>

</div></div></body></html>
